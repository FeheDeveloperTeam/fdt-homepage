      server/index.js, 실제 Vercel 배포는 vercel.json의 rewrite가 모든 경로를 걸어주는
      api/render.js가 담당하고, 둘 다 api/_lib/seoRender.js의 injectSeo를 함께 쓴다
      (src/seoData.js 가 공통 데이터 소스). react-helmet-async는 이 정적 태그를 대체하지
      않고 추가만 하지만, 실제 브라우저에서는 중복돼도 티가 나지 않으므로 그대로 둔다.

    <!--
      검색 결과에 표시되는 사이트 이름은 WebSite 구조화 데이터의 name을 우선해서 쓴다.
      이게 없으면 구글이 제목에서 이름을 추측하는데, 홈 제목은 서비스 문구("유튜브 디스코드 서버 구축 · …")로
      시작해서 엉뚱한 이름이 잡힐 수 있다. alternateName은 한글 팀 이름 검색과 연결해 준다.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FeheDeveloperTeam",
        "alternateName": ["페헤개발팀", "페헤 개발팀", "FDT"],
        "url": "https://www.fehe.dev/"
      }
    </script>
